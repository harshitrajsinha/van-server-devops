apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deploy
  namespace: db
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: db-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-app
    spec:
      containers:
        - name: postgresdb
          image: postgres:alpine3.23
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_PASSWORD
              value: secretpassword0808
            - name: POSTGRES_DB
              value: pgdb
